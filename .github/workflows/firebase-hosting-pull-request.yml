# Upgraded PR Workflow for Agent Fast-Feedback
name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.json'
      - '.agents/**'
      - '.husky/**'
      - 'docs/**'

permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Added Node 22 and Yarn caching so agents get their URLs faster
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile && yarn build --mode staging

      # Generates the Preview URL for the QA Explorer
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DREAMERSCHOLARS }}
          projectId: dreamerscholars-staging
          site: dreamerscholars-staging
