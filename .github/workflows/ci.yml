# Workflow for deploying app to Firebase
# Based on: https://fireship.io/snippets/github-actions-deploy-angular-to-firebase-hosting/
name: CI

# Triggers the workflow when main branch is updated or on a release tag
on:
  push:
    branches:
      - main
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# This workflow just consists of deploying the application
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Deploy app and firestore rules/indices
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # 1. Write the secret key to a temporary JSON file
          echo "$GCP_SA_KEY" > gcp-sa.json

          # 2. Tell the Firebase CLI where to find the credentials
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/gcp-sa.json"

          # 3. Deploy using the local CLI you already downloaded via Yarn!
          npx firebase deploy --only hosting,firestore --project dreamerscholars
