# Workflow for validating package dependencies
name: Audit

# Only run on pull requests that touch yarn.lock
on:
  pull_request:
    branches: [main]
    paths: ['yarn.lock']
  push:
    branches:
      - main
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Find the audit baseline (ONLY applicable for Pull Requests)
  audit-baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      old_num: ${{ steps.audit.outputs.old_num }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Audit the old number of vulnerabilities
        id: audit
        # Using || true so it doesn't crash on vulnerabilities
        # Using grep -oE to extract just the number safely
        run: |
          AUDIT_OUT=$(yarn audit --groups dependencies --summary || true)
          NUM=$(echo "$AUDIT_OUT" | grep "vulnerabilities" | awk '{print $1}' || echo "0")
          echo "old_num=$NUM" >> $GITHUB_OUTPUT

  # Find the current audit
  audit-current:
    runs-on: ubuntu-latest
    outputs:
      new_num: ${{ steps.audit.outputs.new_num }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Audit the new number of vulnerabilities
        id: audit
        run: echo "new_num=$(yarn audit --groups dependencies --summary | tee /dev/fd/2 | grep vulnerabilities | cut -d ' ' -f1)" >> $GITHUB_OUTPUT

  # Compare the baseline and current audits
  compare:
    needs: [audit-baseline, audit-current]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the audit report has improved
        run: |
          if (( ${{ needs.audit-current.outputs.new_num }} <= ${{ needs.audit-baseline.outputs.old_num }} )); then
            echo "✅ Vulnerabilities did not increase! (${{ needs.audit-current.outputs.new_num }} vs ${{ needs.audit-baseline.outputs.old_num }})"
          else
            echo "❌ Vulnerabilities increased! (${{ needs.audit-current.outputs.new_num }} vs ${{ needs.audit-baseline.outputs.old_num }})"
            exit 1
          fi
